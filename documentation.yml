---
# ============================================================================
# documentation.yml
#
# Single Source of Truth for this documentation project.
#
# This file defines:
# - project metadata
# - repository and GitHub information
# - variables used inside RST files
# - build and publish settings
#
# conf.py MUST NOT contain project-specific hardcoded values.
# ============================================================================


# ---------------------------------------------------------------------------
# Project meta information
# ---------------------------------------------------------------------------

ProjectName: OTOBO Installation Guide
Author: Rother OSS GmbH
Copyright: 2019-2026 Rother OSS GmbH, https://otobo.io/

Version: "11.0"
Release: "11.0"


# ---------------------------------------------------------------------------
# Repository information
# ---------------------------------------------------------------------------

Repository:
  Name: doc-otobo-installation


# ---------------------------------------------------------------------------
# GitHub integration
# ---------------------------------------------------------------------------

GitHub:
  User: RotherOSS
  Branch: rel-11_0
  DisplayEditButton: true


# ---------------------------------------------------------------------------
# Variables to be used inside RST files
# (available via rst_prolog in conf.py)
# ---------------------------------------------------------------------------

Variables:
  doc_name: OTOBO Installation Guide
  doc_description: This is the description of the documentation.
  doc_vendor: Rother OSS GmbH
  doc_version: 11.0
  doc_license: GNU Free Documentation License
  doc_url: https://otobo.io
  doc_logo: /opt/otrs/var/sphinx/_static/images/otobo-logo.png
  doc_yearstamp: current_yearstamp
  doc_datestamp: current_datestamp


# ---------------------------------------------------------------------------
# Build & publish configuration
# (used by CI / Perl build scripts)
# ---------------------------------------------------------------------------

Publish: true
Stable: true


# ---------------------------------------------------------------------------
# PDF output configuration
# ---------------------------------------------------------------------------

PDF:
  OutputPath: doc-installation/{{Version}}/{{Language}}/
  Filename: otobo_installation_guide_{{Version}}_{{Language}}.pdf


# ---------------------------------------------------------------------------
# EPUB output configuration
# ---------------------------------------------------------------------------

EPUB:
  OutputPath: doc-installation/{{Version}}/{{Language}}/
  Filename: otobo_installation_guide_{{Version}}_{{Language}}.epub
